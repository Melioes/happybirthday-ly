<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>梁研的生日蛋糕 🎂</title>
    
    <!-- 引入外部依赖库 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

    <style>
        :root {
            --bg-color: #0a0e17;
            --gold: #f7d070;
            --orange: #ff9f43;
            --text-main: #ffffff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background-color: var(--bg-color);
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            color: var(--text-main);
            width: 100vw;
            height: 100vh;
            touch-action: none;
        }

        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* 磨砂玻璃通用样式 */
        .glass-panel {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 16px;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
        }

        /* 顶部标题 */
        #top-title {
            position: absolute;
            top: 5vh;
            left: 50%;
            transform: translateX(-50%);
            padding: 10px 24px;
            font-size: 1.2rem;
            font-weight: 500;
            letter-spacing: 2px;
            z-index: 10;
            opacity: 0;
            white-space: nowrap;
            color: var(--gold);
        }

        /* 底部提示 */
        #bottom-hint {
            position: absolute;
            bottom: 8vh;
            left: 50%;
            transform: translateX(-50%);
            font-size: 1rem;
            color: var(--orange);
            z-index: 10;
            opacity: 0;
            white-space: nowrap;
            text-shadow: 0 0 10px rgba(255, 159, 67, 0.5);
            animation: pulse 2s infinite ease-in-out;
            pointer-events: none;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.6; transform: translateX(-50%) scale(1); }
            50% { opacity: 1; transform: translateX(-50%) scale(1.05); }
        }

        /* 庆祝覆盖层 */
        #celebrate-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 20;
            opacity: 0;
            pointer-events: none;
            background: radial-gradient(circle at center, transparent 0%, rgba(10, 14, 23, 0.4) 100%);
        }

        .blessing-card {
            padding: 30px 40px;
            text-align: center;
            max-width: 90%;
            margin-bottom: 30px;
            transform: translateY(20px);
        }

        .blessing-card h1 {
            font-size: clamp(2rem, 5vw, 3rem);
            color: var(--gold);
            margin-bottom: 15px;
            text-shadow: 0 0 15px rgba(247, 208, 112, 0.4);
        }

        .blessing-card p {
            font-size: clamp(1rem, 3vw, 1.2rem);
            line-height: 1.6;
            color: rgba(255, 255, 255, 0.9);
        }

        .btn-group {
            display: flex;
            gap: 20px;
        }

        .btn {
            padding: 12px 24px;
            font-size: 1rem;
            color: white;
            background: rgba(247, 208, 112, 0.2);
            border: 1px solid var(--gold);
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(5px);
            min-height: 44px;
            min-width: 120px;
            display: flex;
            justify-content: center;
            align-items: center;
            text-decoration: none;
        }

        .btn:hover, .btn:active {
            background: var(--gold);
            color: var(--bg-color);
            box-shadow: 0 0 15px var(--gold);
        }
    </style>
</head>
<body>
    <div id="canvas-container"></div>
    <div id="top-title" class="glass-panel">🎂 梁研的生日蛋糕</div>
    <div id="bottom-hint">✨ 点击蜡烛许愿吹灭</div>
    <div id="celebrate-overlay">
        <div class="blessing-card glass-panel" id="blessing-content">
            <h1>🎉 生日快乐，梁研！</h1>
            <p id="typewriter-text"></p>
        </div>
        <div class="btn-group">
            <a href="index.html" class="btn">返回主页 ←</a>
            <button class="btn" id="btn-restart">再次许愿 🕯️</button>
        </div>
    </div>

    <script>
        const container = document.getElementById('canvas-container');
        let scene, camera, renderer, controls;
        let cakeGroup, particles;
        let candles = [], flames = [], flameLights = [];
        
        let state = {
            isBlown: false
        };

        const isMobile = window.innerWidth <= 768;

        function init() {
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x0a0e17, 0.03);

            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
            camera.position.set(0, 8, 15);

            renderer = new THREE.WebGLRenderer({ antialias: !isMobile, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.2;
            container.appendChild(renderer.domElement);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.minDistance = 8;
            controls.maxDistance = 25;
            controls.maxPolarAngle = Math.PI / 2 - 0.1;
            controls.target.set(0, 3, 0);

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.3);
            scene.add(ambientLight);

            const directionalLight = new THREE.DirectionalLight(0xffffff, 0.6);
            directionalLight.position.set(10, 20, 10);
            scene.add(directionalLight);

            createCake();
            createStars();

            window.addEventListener('resize', onWindowResize);

            const raycaster = new THREE.Raycaster();
            const mouse = new THREE.Vector2();

            function onInteract(event) {
                if (state.isBlown) return;

                let clientX, clientY;
                if (event.changedTouches) {
                    clientX = event.changedTouches[0].clientX;
                    clientY = event.changedTouches[0].clientY;
                } else {
                    clientX = event.clientX;
                    clientY = event.clientY;
                }

                mouse.x = (clientX / window.innerWidth) * 2 - 1;
                mouse.y = -(clientY / window.innerHeight) * 2 + 1;

                raycaster.setFromCamera(mouse, camera);
                const intersects = raycaster.intersectObjects(cakeGroup.children, true);
                
                if (intersects.length > 0) {
                    blowCandles();
                }
            }

            container.addEventListener('click', onInteract);
            container.addEventListener('touchstart', onInteract, {passive: true});
            document.getElementById('btn-restart').addEventListener('click', resetScene);

            renderer.setAnimationLoop(animate);
            playIntro();
        }

        function createCake() {
            cakeGroup = new THREE.Group();
            
            const matBase = new THREE.MeshStandardMaterial({ color: 0xfff0f5, roughness: 0.8 });
            const matMid = new THREE.MeshStandardMaterial({ color: 0xe6e6fa, roughness: 0.7 });
            const matTop = new THREE.MeshStandardMaterial({ color: 0xfffacd, roughness: 0.6 });
            const matDeco = new THREE.MeshStandardMaterial({ color: 0xffb6c1, roughness: 0.5 });

            const baseGeo = new THREE.CylinderGeometry(4, 4.2, 2.5, 32);
            const baseMesh = new THREE.Mesh(baseGeo, matBase);
            baseMesh.position.y = 1.25;
            cakeGroup.add(baseMesh);
            createDecoRing(4.1, 2.5, matDeco);

            const midGeo = new THREE.CylinderGeometry(3, 3.2, 2, 32);
            const midMesh = new THREE.Mesh(midGeo, matMid);
            midMesh.position.y = 3.5;
            cakeGroup.add(midMesh);
            createDecoRing(3.1, 4.5, matDeco);

            const topGeo = new THREE.CylinderGeometry(2, 2.1, 1.5, 32);
            const topMesh = new THREE.Mesh(topGeo, matTop);
            topMesh.position.y = 5.25;
            cakeGroup.add(topMesh);
            createDecoRing(2.05, 6, matDeco);

            const candleGeo = new THREE.CylinderGeometry(0.08, 0.08, 1, 16);
            const candleMat = new THREE.MeshStandardMaterial({ color: 0xffffff });
            const flameGeo = new THREE.SphereGeometry(0.12, 16, 16);
            const flameMat = new THREE.MeshBasicMaterial({ color: 0xff9f43 });

            const candleCount = 5;
            const radius = 1.2;
            const topY = 6;

            for (let i = 0; i < candleCount; i++) {
                const angle = (i / candleCount) * Math.PI * 2;
                const cx = Math.cos(angle) * radius;
                const cz = Math.sin(angle) * radius;

                const candle = new THREE.Mesh(candleGeo, candleMat);
                candle.position.set(cx, topY + 0.5, cz);
                cakeGroup.add(candle);
                candles.push(candle);

                const flame = new THREE.Mesh(flameGeo, flameMat);
                flame.position.set(cx, topY + 1.1, cz);
                flame.scale.y = 1.5;
                cakeGroup.add(flame);
                flames.push(flame);

                const light = new THREE.PointLight(0xff9f43, 1.5, 5);
                light.position.set(cx, topY + 1.2, cz);
                cakeGroup.add(light);
                flameLights.push(light);
            }

            cakeGroup.position.y = -10;
            scene.add(cakeGroup);
        }

        function createDecoRing(radius, y, mat) {
            const geo = new THREE.TorusGeometry(radius, 0.15, 16, 64);
            const mesh = new THREE.Mesh(geo, mat);
            mesh.rotation.x = Math.PI / 2;
            mesh.position.y = y;
            cakeGroup.add(mesh);
        }

        function createStars() {
            const particleCount = isMobile ? 80 : 200;
            const geometry = new THREE.BufferGeometry();
            const positions = new Float32Array(particleCount * 3);

            for (let i = 0; i < particleCount * 3; i += 3) {
                const r = 15 + Math.random() * 20;
                const theta = Math.random() * Math.PI * 2;
                const phi = Math.acos((Math.random() * 2) - 1);
                positions[i] = r * Math.sin(phi) * Math.cos(theta);
                positions[i+1] = r * Math.sin(phi) * Math.sin(theta) + 5;
                positions[i+2] = r * Math.cos(phi);
            }

            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            const material = new THREE.PointsMaterial({
                color: 0xffe6a0, size: 0.15, transparent: true, opacity: 0.6, blending: THREE.AdditiveBlending
            });
            particles = new THREE.Points(geometry, material);
            scene.add(particles);
        }
        
        function playIntro() {
            gsap.to(cakeGroup.position, { y: 0, duration: 2.5, ease: "power3.out" });
            gsap.to("#top-title", { opacity: 1, top: "8vh", duration: 1.5, delay: 1 });
            gsap.to("#bottom-hint", { opacity: 1, duration: 1, delay: 2 });
            gsap.from(camera.position, { x: 15, z: 10, duration: 3, ease: "power2.out" });
        }

        function blowCandles() {
            if (state.isBlown) return;
            state.isBlown = true;
            gsap.to("#bottom-hint", { opacity: 0, duration: 0.5 });
            
            flames.forEach((flame, index) => {
                setTimeout(() => {
                    gsap.to(flame.scale, { x: 0, y: 0, z: 0, duration: 0.3 });
                    gsap.to(flameLights[index], { intensity: 0, duration: 0.4 });
                    if (index === flames.length - 1) setTimeout(celebrate, 500);
                }, index * 200);
            });
        }

        function celebrate() {
            const globalLight = new THREE.AmbientLight(0xffffff, 0.8);
            scene.add(globalLight);
            gsap.to(scene.fog, { density: 0.01, duration: 2 });
            triggerConfetti();

            const overlay = document.getElementById('celebrate-overlay');
            overlay.style.pointerEvents = "auto";
            gsap.to(overlay, { opacity: 1, duration: 1.5, ease: "power2.out" });
            gsap.to(".blessing-card", { y: 0, duration: 1, delay: 0.5, ease: "back.out(1.5)" });

            setTimeout(typeWriterText, 1000);
        }
        
        function triggerConfetti() {
            const end = Date.now() + 5000;
            (function frame() {
                confetti({ particleCount: 5, angle: 60, spread: 55, origin: { x: 0, y: 0.8 }, colors: ['#f7d070', '#ff9f43', '#ffffff', '#ffb6c1'] });
                confetti({ particleCount: 5, angle: 120, spread: 55, origin: { x: 1, y: 0.8 }, colors: ['#f7d070', '#ff9f43', '#ffffff', '#ffb6c1'] });
                if (Date.now() < end) requestAnimationFrame(frame);
            }());
        }

        function typeWriterText() {
            const text = "愿你的每一天都甜如蛋糕，灿若星辰 ✨";
            const el = document.getElementById('typewriter-text');
            el.innerHTML = "";
            let i = 0;
            function type() {
                if (i < text.length) {
                    el.innerHTML += text.charAt(i);
                    i++;
                    setTimeout(type, 100);
                }
            }
            type();
        }

        function resetScene() {
            state.isBlown = false;
            const overlay = document.getElementById('celebrate-overlay');
            overlay.style.pointerEvents = "none";
            gsap.to(overlay, { opacity: 0, duration: 0.5 });
            document.getElementById('typewriter-text').innerHTML = "";
            gsap.to("#bottom-hint", { opacity: 1, duration: 0.5, delay: 1 });

            flames.forEach(flame => gsap.to(flame.scale, { x: 1, y: 1.5, z: 1, duration: 0.5, delay: 0.5 }));
            flameLights.forEach(light => gsap.to(light, { intensity: 1.5, duration: 0.5, delay: 0.5 }));
            gsap.to(camera.position, { x: 0, y: 8, z: 15, duration: 1.5, ease: "power2.inOut" });
        }

        function animate() {
            const time = performance.now() * 0.001;
            if (!state.isBlown) {
                flames.forEach((flame, i) => {
                    const flicker = Math.sin(time * 10 + i) * 0.05 + Math.random() * 0.05;
                    flame.scale.set(1 + flicker, 1.5 + flicker * 2, 1 + flicker);
                    flameLights[i].intensity = 1.5 + flicker * 2;
                });
            }
            if (particles) particles.rotation.y = time * 0.05;
            controls.update();
            renderer.render(scene, camera);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        window.addEventListener('load', init);
    </script>
</body>
</html>
